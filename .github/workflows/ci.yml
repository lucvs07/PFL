name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Só PRs cancelam a rodada anterior; em main cada commit precisa do seu resultado (inclui o gate).
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build:client

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/server.Dockerfile
          cache-from: type=gha,scope=server
          cache-to: type=gha,scope=server,mode=max
      - uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/client.Dockerfile
          cache-from: type=gha,scope=client
          cache-to: type=gha,scope=client,mode=max

  # portão de balanceamento (milhares de partidas): mais lento, fora dos PRs
  gate:
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run test:gate
